<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <title>The economic sweet spot between shortfall and overshoot</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Shortfall -->
  <g>
    <rect x="40" y="50" width="120" height="200" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="100" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Shortfall</text>
    <text x="100" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">
      <tspan x="100" dy="0">Basic needs</tspan>
      <tspan x="100" dy="14">go unmet</tspan>
    </text>
  </g>

  <line x1="162" y1="150" x2="177" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Sweet spot -->
  <g>
    <rect x="180" y="50" width="320" height="200" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">The sweet spot</text>
    <text x="200" y="112" dominant-baseline="central" font-size="12" fill="#0F6E56">&#8226; Fair work that sustains families</text>
    <text x="200" y="140" dominant-baseline="central" font-size="12" fill="#0F6E56">&#8226; Invest wisely, not on borrowed time</text>
    <text x="200" y="168" dominant-baseline="central" font-size="12" fill="#0F6E56">&#8226; Youth inherit prosperity, not debt</text>
    <text x="200" y="196" dominant-baseline="central" font-size="12" fill="#0F6E56">&#8226; Land &amp; water stewarded responsibly</text>
  </g>

  <line x1="502" y1="150" x2="517" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- Overshoot -->
  <g>
    <rect x="520" y="50" width="120" height="200" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="580" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Overshoot</text>
    <text x="580" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">
      <tspan x="580" dy="0">Resources</tspan>
      <tspan x="580" dy="14">depleted</tspan>
    </text>
  </g>
</svg>
